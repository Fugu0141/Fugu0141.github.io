<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活動 | ふぐ / Fugu</title>
  <meta name="description" content="ふぐ / Fugu の過去365日のGitHub活動を、世界地図に散らばる365個の光として可視化しています。">

  <!-- Activityページ専用の見た目 -->
  <link rel="stylesheet" href="assets/activity.css">

  <!-- 背景演出にのみp5.jsを使用 -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js" defer></script>

  <!-- ページUI / 世界地図の描画 -->
  <script src="assets/activity-page.js" defer></script>
  <script src="assets/activity-art.js" defer></script>
</head>
<body data-lang="ja" data-page="activity">
  <div class="paper-glow" aria-hidden="true"></div>
  <div id="p5-bg" aria-hidden="true"></div>

  <header data-site-header></header>

  <main>
    <section class="shell page-hero reveal">
      <span class="kicker">
        <span class="lang-ja">活動</span>
        <span class="lang-en">Activity</span>
      </span>

      <h1>
        <span class="lang-ja">365日の光が、<br>世界にひろがる。</span>
        <span class="lang-en">365 days,<br>spread across the world.</span>
      </h1>

      <p class="lang-ja">過去365日のGitHub活動を、世界に散らばる365個の丸として表現しています。活動が多い日ほど、光は強く鮮やかになります。</p>
      <p class="lang-en">The last 365 days of GitHub activity are scattered across the world as 365 lights. Busier days glow brighter.</p>

      <div class="hero-sticker" aria-hidden="true">●</div>
    </section>

    <section class="shell activity-art-section">
      <div class="activity-art-frame world-frame reveal">
        <canvas
          class="activity-art-canvas"
          data-activity-art
          role="img"
          aria-label="A world map with 365 glowing circles. Each circle represents one day of GitHub activity and stronger colors indicate more contributions."
        ></canvas>

        <div class="activity-art-palette" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>

      <div class="activity-art-footer">
        <a
          class="activity-art-github"
          href="https://github.com/Fugu0141"
          target="_blank"
          rel="noopener"
          aria-label="GitHub"
        >↗</a>
      </div>
    </section>
  </main>

  <footer data-site-footer></footer>
</body>
</html>
