<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - ページが見つかりません</title>

  <!-- 404ページ専用 -->
  <link rel="stylesheet" href="assets/404.css">
  <script src="assets/404.js" defer></script>
</head>
<body>
  <span class="bubble" style="--size:74px; --left:7%; --top:12%; --duration:6.8s;" aria-hidden="true"></span>
  <span class="bubble" style="--size:38px; --left:86%; --top:18%; --duration:5.8s;" aria-hidden="true"></span>

  <main class="wrap" aria-labelledby="page-title">

      <span class="question q1" aria-hidden="true">?</span>

    <a class="button" id="homeButton" href="/">Topへ戻る</a>
