name: Update portfolio image manifest

on:
  workflow_dispatch:
  push:
    paths:
      - "content/home-promos/**/*.png"
      - "content/projects/**/*.png"
      - "scripts/build-content-manifest.js"
      - ".github/workflows/update-portfolio-content.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Build image manifest
        run: node scripts/build-content-manifest.js

      - name: Commit manifest
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets/content-manifest.json)" ]; then
            echo "Portfolio image manifest is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/content-manifest.json
          git commit -m "Update portfolio image manifest"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
