name: Update contribution data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
  push:
    branches:
      - main
      - redesign-game-portfolio
      - redesign-playful-portfolio
    paths:
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Fetch contribution calendar
        uses: actions/github-script@v7
        env:
          TARGET_USER: Fugu0141
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const to = new Date();
            to.setUTCHours(23, 59, 59, 999);
            const from = new Date(to);
            from.setUTCDate(from.getUTCDate() - 364);
            from.setUTCHours(0, 0, 0, 0);

            const query = `
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                          contributionLevel
                        }
                      }
                    }
                  }
                }
              }
            `;

            const data = await github.graphql(query, {
              login: process.env.TARGET_USER,
              from: from.toISOString(),
              to: to.toISOString()
            });

            const calendar = data.user?.contributionsCollection?.contributionCalendar;
            if (!calendar) throw new Error('Contribution calendar was not returned.');

            const days = calendar.weeks
              .flatMap(week => week.contributionDays)
              .filter(day => day.date >= from.toISOString().slice(0, 10) && day.date <= to.toISOString().slice(0, 10))
              .sort((a, b) => a.date.localeCompare(b.date));

            const output = {
              generatedAt: new Date().toISOString(),
              from: from.toISOString().slice(0, 10),
              to: to.toISOString().slice(0, 10),
              totalContributions: calendar.totalContributions,
              days: days.map(day => ({
                date: day.date,
                count: day.contributionCount,
                level: day.contributionLevel
              }))
            };

            fs.mkdirSync(path.join(process.cwd(), 'assets'), { recursive: true });
            fs.writeFileSync(
              path.join(process.cwd(), 'assets', 'contributions.json'),
              JSON.stringify(output, null, 2) + '\n',
              'utf8'
            );

      - name: Commit updated data
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets/contributions.json)" ]; then
            echo "Contribution data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.json
          git commit -m "Update contribution calendar data"
          git push
